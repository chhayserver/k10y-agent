# Push a tag vX.Y.Z (after `make release VERSION=X.Y.Z` and a commit) and this publishes it:
# checks that every version, the changelog and the installers say X.Y.Z, runs the tests, builds and pushes the
# multi-arch image to Docker Hub, creates the GitHub release with the install files, and deploys the website.
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN    a Docker Hub access token with Read & Write on k10y/k10y-agent
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   optional: deploys the website to Cloudflare Pages
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      IMAGE: docker.io/k10y/k10y-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Version from the tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Versions, changelog and installers agree
        run: |
          pip install pyyaml
          python scripts/release.py check "${{ steps.v.outputs.version }}"
          git diff --exit-code deploy/install
      - name: Tests
        run: |
          pip install ".[server,dev]"
          python -m pytest -q tests
        env:
          K10Y_AUDIT_PATH: /tmp/audit.jsonl

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/release.py notes "${{ steps.v.outputs.version }}" > notes.md
          gh release create "$GITHUB_REF_NAME" --title "k10y ${{ steps.v.outputs.version }}" --latest --notes-file notes.md \
            deploy/install/install.yaml deploy/install/install-readonly.yaml deploy/install/rbac-helm.yaml docker-compose.yml

      - name: Website
        if: ${{ env.CF_TOKEN != '' }}
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd website && npm ci --no-audit --no-fund && npm run build
          npx --yes wrangler@4 pages deploy .vitepress/dist --project-name k10y-agents --branch main --commit-dirty=true
