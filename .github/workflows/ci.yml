# Runs on every pull request and every push to main: unit tests, the UI type check and build, the
# website build, and a Docker image build (not pushed). The "ci" job is the required check for main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write   # Trivy results in Security -> Code scanning

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ".[server,dev]"
      - name: Versions agree and the installers are current
        run: |
          python scripts/release.py check "$(python -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          git diff --exit-code deploy/install deploy/helm
      - run: python -m pytest -q tests
        env:
          K10Y_AUDIT_PATH: /tmp/audit.jsonl

  web:
    name: UI type check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build   # vue-tsc --noEmit && vite build

  website:
    name: Website build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  image:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: k10y-ci:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Known vulnerabilities in the image: fail on CRITICAL ones that have a fix; report HIGH and up to Security.
      - name: Trivy (fail on fixable critical)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.57.1 image --quiet \
            --severity CRITICAL --ignore-unfixed --exit-code 1 k10y-ci:test
      - name: Trivy report
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$PWD:/out" aquasec/trivy:0.57.1 image --quiet \
            --severity HIGH,CRITICAL --ignore-unfixed --format sarif -o /out/trivy.sarif k10y-ci:test
      - uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
          category: trivy-image

  e2e:
    name: Browser tests (hub + kind cluster)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: k10y-ci:test
          cache-from: type=gha
      - name: Install kind (pinned, checksum verified)
        run: |
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 -o kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum | awk '{print $1"  kind"}' | sha256sum -c -
          sudo install -m 0755 kind /usr/local/bin/kind && kind version
      - run: IMAGE=k10y-ci:test e2e/ci.sh

  ci:
    name: ci
    if: always()
    needs: [python, web, website, image, e2e]
    runs-on: ubuntu-latest
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "All checks passed"
