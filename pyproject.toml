[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
authors = [{ name = "Kang Kimchhay" }]
name = "k10y-agent"
version = "2.2.1"
description = "All your DevOps tools in one place: control room for Kubernetes clusters and HAProxy load balancers (agent, hub, web dashboard, CLI)."
readme = "README.md"
requires-python = ">=3.9"
# Base install = CLI only (talks to agents over HTTP).
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
# The agent itself (runs in the cluster, built into the Docker image).
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=13",          # pod shell (agent and hub)
    "kubernetes>=29",
    "pydantic-settings>=2",
    "cryptography>=42",
    # hub (K10Y_MODE=hub): users, roles, clusters, audit in PostgreSQL
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "argon2-cffi>=23",
]
dev = ["pytest>=8"]

[project.scripts]
k10y = "k10y_agent.cli:app"
k10y-agent = "k10y_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k10y_agent"]
