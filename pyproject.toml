[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "k10y-agent"
version = "1.2.0"
description = "Monitor and control Kubernetes clusters: in-cluster agent, REST API, web dashboard and multi-cluster CLI."
readme = "README.md"
requires-python = ">=3.9"
# Base install = CLI only (talks to agents over HTTP).
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13",
    "pyyaml>=6",
]

[project.optional-dependencies]
# The agent itself (runs in the cluster, built into the Docker image).
server = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "kubernetes>=29",
    "pydantic-settings>=2",
]
dev = ["pytest>=8"]

[project.scripts]
k10y = "k10y_agent.cli:app"
k10y-agent = "k10y_agent.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/k10y_agent"]
