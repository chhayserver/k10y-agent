# Encrypts the secrets k10y stores (agent tokens, AI keys, alert and SSO credentials). Keep a copy:
# without it, those stored secrets can't be read back.
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "k10y-hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  secret-key: {{ include "k10y-hub.keep" (dict "ctx" . "key" "secret-key" "new" (randAlphaNum 48)) }}
  admin-password: {{ if .Values.adminPassword }}{{ .Values.adminPassword | b64enc }}{{ else }}{{ include "k10y-hub.keep" (dict "ctx" . "key" "admin-password" "new" (printf "%s-%s" (randAlphaNum 10) (randNumeric 4))) }}{{ end }}
  {{- if .Values.postgresql.enabled }}
  postgres-password: {{ include "k10y-hub.keep" (dict "ctx" . "key" "postgres-password" "new" (randAlphaNum 32)) }}
  {{- end }}
