# Generated by scripts/gen_chart.py from deploy/k8s/*.yaml. Do not edit by hand.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k10y-agent
  labels: {{- include "k10y.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {app: k10y-agent}
  template:
    metadata:
      labels:
        app: k10y-agent
        {{- include "k10y.labels" . | nindent 8 }}
    spec:
      serviceAccountName: k10y-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - {name: http, containerPort: 8080}
          env:
            - name: K10Y_CLUSTER_NAME
              value: {{ .Values.clusterName | default "kubernetes" | quote }}
            - name: K10Y_TOKEN_SECRET
              value: k10y-agent
            - name: K10Y_CONTROL_ENABLED
              value: {{ .Values.control | quote }}
            - name: K10Y_HELM_ENABLED
              value: {{ and .Values.control .Values.helm | quote }}
            - name: K10Y_PROTECTED_NAMESPACES
              value: {{ join "," .Values.protectedNamespaces | quote }}
            - name: K10Y_AUDIT_PATH
              value: /data/audit.jsonl
            - name: K10Y_TLS
              value: "true"
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
              scheme: HTTPS
            periodSeconds: 20
          resources: {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
              - ALL
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: data, emptyDir: {}}
        - {name: tmp, emptyDir: {}}
      {{- with .Values.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: k10y-agent
  labels: {{- include "k10y.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector: {app: k10y-agent}
  ports:
    - name: http
      port: 8080
      targetPort: http
      {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
