# Optional: let the k10y agent roll back Helm releases from the hub.
#
# Helm rolls back by re-applying whatever the release's chart contains and by rewriting its release
# records (Secrets). The agent therefore needs Kubernetes' built-in "edit" role: it can then create,
# change and delete most namespaced objects, including Secrets (but not RBAC, CRDs or anything
# cluster-wide). Protected namespaces are still refused by the agent, and every rollback goes through
# the hub's permissions (workloads.rollback), review and audit.
#
# Turn it on:
#   kubectl apply -f rbac-helm.yaml
#   kubectl -n k10y set env deploy/k10y-agent K10Y_HELM_ENABLED=true
# Turn it off:
#   kubectl -n k10y set env deploy/k10y-agent K10Y_HELM_ENABLED-
#   kubectl delete -f rbac-helm.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k10y-agent-helm
  labels:
    app.kubernetes.io/name: k10y-agent
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: k10y-agent
    namespace: k10y
