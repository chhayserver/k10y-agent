---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: k10y-agent
  namespace: k10y
  labels:
    app: k10y-agent
    app.kubernetes.io/name: k10y-agent
    app.kubernetes.io/version: 2.2.0
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k10y-agent
  template:
    metadata:
      labels:
        app: k10y-agent
    spec:
      serviceAccountName: k10y-agent
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: agent
        image: docker.io/k10y/k10y-agent:2.2.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        env:
        - name: K10Y_CLUSTER_NAME
          valueFrom:
            configMapKeyRef:
              name: k10y-settings
              key: cluster-name
              optional: true
        - name: K10Y_TOKEN_SECRET
          value: k10y-agent
        - name: K10Y_CONTROL_ENABLED
          value: 'true'
        - name: K10Y_PROTECTED_NAMESPACES
          value: kube-system,k10y
        - name: K10Y_AUDIT_PATH
          value: /data/audit.jsonl
        - name: K10Y_TLS
          value: 'true'
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTPS
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
            scheme: HTTPS
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 320Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: data
          mountPath: /data
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: k10y-agent
  namespace: k10y
  labels:
    app.kubernetes.io/name: k10y-agent
    app.kubernetes.io/version: 2.2.0
spec:
  type: NodePort
  selector:
    app: k10y-agent
  ports:
  - name: http
    port: 8080
    targetPort: http
    nodePort: 30800
