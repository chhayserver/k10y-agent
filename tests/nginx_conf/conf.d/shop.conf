server {
    listen 80;
    server_name shop.example.com www.shop.example.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl http2 default_server;
    server_name shop.example.com;
    ssl_certificate /etc/nginx/certs/shop.pem;
    ssl_certificate_key /etc/nginx/certs/shop.key;
    location / { proxy_pass http://shop; }
    location /api/ { proxy_pass http://api/; proxy_set_header Upgrade $http_upgrade; }
    location = /health { return 200 "ok"; }
    location ~* \.(png|jpg)$ { root /srv/static; }
    location ^~ /static/ { alias /srv/static/; }
    location /nginx_status { stub_status; allow 127.0.0.1; deny all; }
}
