user nginx;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }
http {
    log_format k10y escape=json '{"t":"$time_iso8601","host":"$host","s":$status}';
    access_log /var/log/nginx/access.log k10y;
    upstream shop {
        least_conn;
        server shop1:80 weight=3 max_fails=2;
        server shop2:80;
        server shop3:80 backup;
        keepalive 16;
    }
    upstream api { server 10.0.0.7:8080; server 10.0.0.8:8080 down; }
    include /etc/nginx/conf.d/*.conf;
}
stream {
    upstream pg { server db1:5432; }
    server { listen 5432; proxy_pass pg; }
}
