# k10y hub + PostgreSQL.  Start:  make hub-up   (creates .env with random secrets on first run)
# Then open https://localhost:8443 (self-signed certificate) and log in as the admin from .env.
# Data is stored in folders on this machine: ${K10Y_DATA_DIR:-./data}/postgres and .../hub
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: k10y
      POSTGRES_USER: k10y
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make hub-init first}
    volumes:
      - ${K10Y_DATA_DIR:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U k10y -d k10y"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    # Not published on the host: only the hub can reach the database.

  # Daily logical backups of the database into ${K10Y_DATA_DIR:-./data}/backups (gzip, newest N kept).
  # Restore one with: make hub-restore FILE=data/backups/<file>.sql.gz
  backup:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: k10y
      PGDATABASE: k10y
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_EVERY_HOURS: ${K10Y_BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP: ${K10Y_BACKUP_KEEP:-14}
    volumes:
      - ${K10Y_DATA_DIR:-./data}/backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -u -o pipefail
        umask 077
        while true; do
          f="/backups/k10y-$$(date -u +%Y%m%d-%H%M%S).sql.gz"
          if pg_dump --clean --if-exists --no-owner | gzip > "$$f.part"; then
            mv "$$f.part" "$$f"; echo "$$(date -u +%FT%TZ) backup ok: $$(basename $$f) ($$(du -h $$f | cut -f1))"
          else
            rm -f "$$f.part"; echo "$$(date -u +%FT%TZ) backup FAILED" >&2
          fi
          ls -1t /backups/k10y-*.sql.gz 2>/dev/null | tail -n +$$((BACKUP_KEEP + 1)) | xargs -r rm -f
          sleep $$((BACKUP_EVERY_HOURS * 3600))
        done
    restart: unless-stopped

  hub:
    image: ${K10Y_IMAGE:-docker.io/k10y/k10y-agent:2.3.1}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      K10Y_MODE: hub
      K10Y_PORT: "8443"
      K10Y_TLS: "true"
      K10Y_TLS_DIR: /data/tls
      K10Y_DATABASE_URL: postgresql://k10y:${POSTGRES_PASSWORD}@postgres:5432/k10y
      # Encrypts agent tokens, AI keys and alert credentials stored in PostgreSQL. Keep it safe:
      # without it the stored secrets cannot be decrypted.
      K10Y_SECRET_KEY: ${K10Y_SECRET_KEY:?run make hub-init first}
      K10Y_ADMIN_USER: ${K10Y_ADMIN_USER:-admin}
      K10Y_ADMIN_PASSWORD: ${K10Y_ADMIN_PASSWORD:-}
      # HAProxy logs (syslog over UDP): point "log <hub>:5514" at the hub. 0 turns it off.
      K10Y_SYSLOG_PORT: ${K10Y_SYSLOG_PORT:-5514}
    ports:
      - "${K10Y_HUB_PORT:-8443}:8443"
      - "${K10Y_SYSLOG_PUBLISH:-5514}:5514/udp"
    volumes:
      - ${K10Y_DATA_DIR:-./data}/hub:/data     # self-signed certificate (so the browser exception stays valid)
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
